<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Контроль качества диалогов · Freedom Broker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Весь интерфейс монтируется в #cqa-root: тот же блок можно встроить как HTML-ресурс Dynamics 365. -->
  <div id="cqa-root" class="cqa">
    <aside class="sidebar">
      <div class="brand">
        <div class="wordmark">FREEDOM <span>BROKER</span></div>
        <small>Контроль качества обслуживания</small>
      </div>
      <div class="nav-label">Разделы</div>
      <nav aria-label="Разделы" id="nav"></nav>
      <div id="model-status" class="model-status"></div>
    </aside>
    <div class="content">
      <header class="topbar">
        <div class="crumbs" id="crumbs"></div>
        <div class="env" id="env"></div>
      </header>
      <main id="view"></main>
      <footer class="footer">
        <span>Freedom Broker · Conversation Quality Analytics</span>
        <span>Оценки формирует ИИ по утверждённому чек-листу; итог рассчитывает сервер</span>
      </footer>
    </div>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
