<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA · Контроль качества диалогов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Весь интерфейс монтируется в #cqa-root: тот же блок можно встроить как HTML-ресурс Dynamics 365. -->
  <div id="cqa-root" class="cqa">
    <aside class="sidebar">
      <div class="brand">
        <span class="logo" aria-hidden="true">F</span>
        <div><b>CQA</b><small>Контроль качества диалогов</small></div>
      </div>
      <nav aria-label="Разделы">
        <a href="#/" data-nav="list"><span class="ico" aria-hidden="true">☰</span><span><b>Диалоги</b><small>Загрузка и оценка</small></span></a>
        <a href="#/analytics" data-nav="analytics"><span class="ico" aria-hidden="true">▤</span><span><b>Аналитика</b><small>Сводка по качеству</small></span></a>
        <a href="#/appeals" data-nav="appeals"><span class="ico" aria-hidden="true">⚖</span><span><b>Апелляции</b><small>Спорные оценки</small></span><span id="appeal-count" class="count" hidden></span></a>
        <a href="#/checklist" data-nav="checklist"><span class="ico" aria-hidden="true">✓</span><span><b>Чек-лист</b><small>Критерии и веса</small></span></a>
      </nav>
      <div id="model-status" class="model-status"></div>
    </aside>
    <main id="view"></main>
    <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <script src="app.js"></script>
</body>
</html>
